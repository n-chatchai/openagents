<svg xmlns="http://www.w3.org/2000/svg" viewBox="0.672 1.422 22.255 22.255" width="24" height="24" role="img" aria-label="Erawan">
  <!-- Erawan mark. One solid body; the ear sweep, the eye and the legs are cut
       out through a mask, so the mark is a single colour and works on any
       background. Faces right.
       Grid: body arc r 8.6 centred (10.2,13); ear cut stroke 1.8; eye r 1.3;
       legs 3.6 wide with 2.4 between them, cut 3.0 deep. The gaps' right
       edges sit at 7.6 and 13.6 on purpose: there, each gap keeps one pixel
       column at least 98% clear at 16, 20, 24 and 32px. Move a gap and 2.4 can
       straddle two columns and go grey in both.
       The viewBox is the refit, and it is not 0 0 24 24 on purpose: the drawing
       spans 20.4 × 16.3 and used to sit inside a 24 box off-centre, so an icon
       spent its pixels on nothing. Framing it here rather than scaling the art
       keeps every coordinate below the round number it was drawn as. Copy the
       viewBox with the paths — a copy left at 0 0 24 24 renders a smaller,
       off-centre mark and nothing says so.
       Canonical source — copy this file, do not redraw it. -->
  <defs>
    <mask id="erawan-cuts">
      <rect width="24" height="24" fill="#fff"/>
      <g fill="#000">
        <path d="M9 5.4c2.6 2 3 5 3 7.4 0 2.6 1.2 4 3 4 1.4 0 2.4-1 2.4-2.4"
              fill="none" stroke="#000" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="16.6" cy="9.6" r="1.3"/>
        <path d="M5.2 20.8v-3a1.2 1.2 0 0 1 2.4 0v3z"/>
        <path d="M11.2 20.8v-3a1.2 1.2 0 0 1 2.4 0v3z"/>
      </g>
    </mask>
  </defs>
  <g mask="url(#erawan-cuts)">
    <path d="M1.6 20.7V13a8.6 8.6 0 0 1 8.6-8.6h3.4A8.4 8.4 0 0 1 22 12.8v7.9z"
          fill="currentColor"/>
  </g>
</svg>
